<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Overlay</title>
<link rel="stylesheet" href="/editor.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <header class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,21C12,21 4.5,16.4 2.4,11.6C0.9,8 3.1,4 6.9,4C9,4 10.5,5.2 12,7C13.5,5.2 15,4 17.1,4C20.9,4 23.1,8 21.6,11.6C19.5,16.4 12,21 12,21Z"/></svg>
      <div class="brand-text">
        <h1 data-i18n="title"></h1>
        <p>Pulse Overlay</p>
      </div>
      <div id="uiLang" class="uilang"></div>
    </header>

    <section class="block">
      <h2 data-i18n="presets"></h2>
      <div id="presets" class="presets"></div>
    </section>

    <div id="controls"></div>

    <button id="reset" class="btn ghost wide" type="button" data-i18n="reset"></button>
  </aside>

  <main class="stage">
    <div class="toolbar">
      <div class="tgroup">
        <span class="lbl" data-i18n="previewData"></span>
        <div class="seg" id="dataSeg"></div>
      </div>
      <div class="tgroup" id="demoStateGroup">
        <span class="lbl" data-i18n="state"></span>
        <select id="demoState">
          <option value="live" data-i18n="stLive"></option>
          <option value="lost" data-i18n="stLost"></option>
          <option value="reconnecting" data-i18n="stReconnecting"></option>
          <option value="off" data-i18n="stOff"></option>
        </select>
      </div>
      <div class="tgroup">
        <span class="lbl" data-i18n="background"></span>
        <div class="seg" id="bgSeg"></div>
      </div>
    </div>

    <div class="preview" id="preview">
      <iframe id="frame" data-i18n-title="previewTitle"></iframe>
    </div>

    <div class="output">
      <div class="orow">
        <label class="lbl" for="device" data-i18n="watch"></label>
        <select id="device"><option value="" data-i18n="autoWatch"></option></select>
        <input id="url" readonly data-i18n-aria="urlLabel">
        <button id="copy" class="btn primary" type="button" data-i18n="copy"></button>
      </div>
      <div class="orow hint">
        <span id="size" class="size"></span>
        <span data-i18n-html="howto"></span>
      </div>
    </div>
  </main>
</div>
<script src="/editor.js"></script>
</body>
</html>
